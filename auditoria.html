<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría - Hipergalerias</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="conexion.js"></script>
  <style>
    :root {
      --bg: #f4f6f3;
      --sf: #fff;
      --sf2: #f7f9f6;
      --ln: #dfe6e0;
      --tx: #17231b;
      --mu: #5d6f63;
      --g: #166534;
      --gl: #1f8a4c;
      --mint: #e8f4ec;
      --gold: #f4b400;
      --red: #c8372d;
      --redbg: #fceceb;
      --amb: #8f5600;
      --ambbg: #fff3d6;
      --blu: #0b6aa8;
      --blubg: #e4f1fa
    }

    body.dark {
      --bg: #0c1511;
      --sf: #121e19;
      --sf2: #172620;
      --ln: #233a30;
      --tx: #e8f2ec;
      --mu: #9bb2a5;
      --g: #1f8a4c;
      --mint: #163a28;
      --redbg: #3d1f22;
      --amb: #f5c15a;
      --ambbg: #41331a;
      --blu: #6cb9ee;
      --blubg: #16303f;
      --red: #ff8a80
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 14px/1.45 Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx)
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 28px;
      background: var(--sf);
      border-bottom: 3px solid var(--gold)
    }

    .hl {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .hl img {
      height: 42px;
      mix-blend-mode: multiply
    }

    body.dark .hl img {
      mix-blend-mode: normal;
      background: #fff;
      border-radius: 6px;
      padding: 2px 5px
    }

    .hl h1 {
      margin: 0;
      font-size: 1.05rem
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 14px;
      border: 1px solid var(--ln);
      border-radius: 99px;
      background: var(--sf);
      color: var(--g);
      font-weight: 700;
      text-decoration: none
    }

    .back:hover {
      background: var(--mint)
    }

    .hr {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .chip {
      padding: 6px 12px;
      border: 1px solid var(--ln);
      border-radius: 99px;
      font-weight: 600;
      font-size: .82rem;
      background: var(--sf2)
    }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 22px 28px 50px
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 16px
    }

    .kpi {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-left: 5px solid var(--gl);
      border-radius: 10px;
      padding: 14px 18px
    }

    .kpi.w {
      border-left-color: var(--gold)
    }

    .kpi.c {
      border-left-color: var(--red);
      cursor: pointer
    }

    .kpi small {
      color: var(--mu);
      font-weight: 600
    }

    .kpi b {
      display: block;
      font-size: 1.8rem;
      letter-spacing: -.03em
    }

    .panel {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      align-items: end
    }

    .filters label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: var(--mu);
      margin-bottom: 4px
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: var(--sf)
    }

    .filters input:focus,
    .filters select:focus {
      outline: 2px solid var(--gl);
      outline-offset: 0
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px
    }

    .btn {
      border: 0;
      border-radius: 99px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: .82rem;
      cursor: pointer;
      background: var(--g);
      color: #fff
    }

    .btn:hover {
      filter: brightness(.92)
    }

    .btn.o {
      background: transparent;
      color: var(--tx);
      border: 1px solid var(--ln)
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: .82rem
    }

    .tw {
      overflow: auto;
      border: 1px solid var(--ln);
      border-radius: 10px;
      max-height: 62vh
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .82rem
    }

    th,
    td {
      padding: 9px 12px;
      text-align: left;
      border-bottom: 1px solid var(--ln);
      white-space: nowrap
    }

    th {
      position: sticky;
      top: 0;
      background: var(--mint);
      color: var(--g);
      z-index: 1
    }

    body.dark th {
      color: #9ae8b8
    }

    td.res {
      white-space: normal;
      min-width: 240px;
      max-width: 420px
    }

    tbody tr {
      cursor: pointer
    }

    tbody tr:hover {
      background: var(--mint)
    }

    tr.pend td:first-child {
      box-shadow: inset 4px 0 0 var(--red)
    }

    .b {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 700
    }

    .insert {
      background: #e3f3e9;
      color: #17703d
    }

    .update {
      background: var(--blubg);
      color: var(--blu)
    }

    .delete {
      background: var(--redbg);
      color: var(--red)
    }

    .evento {
      background: var(--ambbg);
      color: var(--amb)
    }

    .info {
      background: var(--sf2);
      color: var(--mu)
    }

    .aviso {
      background: var(--ambbg);
      color: var(--amb)
    }

    .critico {
      background: var(--redbg);
      color: var(--red)
    }

    .pg {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      color: var(--mu)
    }

    .empty {
      text-align: center;
      padding: 34px;
      color: var(--mu);
      white-space: normal
    }

    .ov {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(8, 20, 13, .55);
      z-index: 100
    }

    .ov.on {
      display: flex
    }

    .card {
      width: 760px;
      max-width: 100%;
      max-height: 92vh;
      overflow: auto;
      background: var(--sf);
      border-radius: 14px;
      border-top: 5px solid var(--gold);
      padding: 22px
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin: 14px 0
    }

    .meta div {
      background: var(--sf2);
      border: 1px solid var(--ln);
      border-radius: 8px;
      padding: 8px 12px
    }

    .meta small {
      display: block;
      color: var(--mu);
      font-weight: 600;
      font-size: .72rem
    }

    .why {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--ambbg);
      color: var(--amb);
      font-weight: 600;
      margin-bottom: 14px
    }

    .frase {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 12px 0 4px;
      line-height: 1.35
    }

    .frase u {
      text-decoration: none;
      color: var(--g)
    }

    body.dark .frase u {
      color: #9ae8b8
    }

    .sub {
      margin: 6px 0 10px;
      font-size: .95rem
    }

    .ch {
      padding: 10px 12px;
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: var(--sf2);
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .ch>b {
      min-width: 170px
    }

    .ar {
      color: var(--mu)
    }

    .ch .old {
      background: var(--redbg);
      color: var(--red);
      padding: 2px 8px;
      border-radius: 6px;
      text-decoration: line-through
    }

    .ch .new {
      background: var(--mint);
      color: var(--gl);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700
    }

    .ch .val {
      font-weight: 600
    }

    .ent {
      flex-basis: 100%;
      padding: 6px 10px;
      border-left: 3px solid var(--gl);
      background: var(--sf);
      border-radius: 4px
    }

    .ent em {
      color: var(--mu);
      font-style: normal
    }

    details.tec {
      margin: 12px 0;
      color: var(--mu)
    }

    details.tec summary {
      cursor: pointer;
      font-weight: 600
    }

    #gate {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--mu);
      font-weight: 600;
      transition: opacity .3s
    }

    #gate.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none
    }

    @media(max-width:700px) {

      header,
      main {
        padding-left: 14px;
        padding-right: 14px
      }

      .ch>b {
        min-width: 100%
      }
    }
  .lang-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-weight:700;font-size:.82rem;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.lang-btn:hover{border-color:var(--gl);box-shadow:0 0 0 3px rgba(31,138,76,.15)}
.lang-btn:active{transform:scale(.97)}
</style>
</head>

<body>
  <div id="gate">Verificando permisos…</div>
  <header>
    <div class="hl">
      <a class="back" href="index.html">← Inicio</a>
      <img src="logo.png" alt="Hipergalerias" onerror="this.onerror=null;this.src='logo.jpeg'">
      <h1>Auditoría del sistema</h1>
    </div>
    <div class="hr"><button type="button" class="lang-btn" data-no-i18n onclick="cambiarIdioma()" title="Idioma / 语言" aria-label="Idioma / 语言"><span aria-hidden="true">🌐</span><b>中文</b></button><span class="chip" id="quien">…</span><button class="btn o" id="tema">🌙</button></div>
  </header>

  <main>
    <section class="kpis">
      <div class="kpi"><small>Cambios hoy</small><b id="kHoy">–</b></div>
      <div class="kpi"><small>Últimos 7 días</small><b id="kSem">–</b></div>
      <div class="kpi c" id="kCritCard" title="Filtrar pendientes"><small>Críticos y avisos sin revisar</small><b
          id="kCrit">–</b></div>
    </section>

    <section class="panel">
      <div class="filters">
        <div><label for="fDesde">Desde</label><input type="date" id="fDesde"></div>
        <div><label for="fHasta">Hasta</label><input type="date" id="fHasta"></div>
        <div><label for="fMod">Módulo</label><select id="fMod">
            <option value="">Todos</option>
            <option value="Recepción y Fechas">Recepción y Fechas</option>
            <option value="Descuentos">Descuentos</option>
            <option value="Recetario">Recetario</option>
          </select></div>
        <div><label for="fTabla">Qué se modificó</label><select id="fTabla"></select></div>
        <div><label for="fAcc">Acción</label><select id="fAcc">
            <option value="">Todas</option>
            <option value="insert">Creación</option>
            <option value="update">Modificación</option>
            <option value="delete">Eliminación</option>
            <option value="evento">Evento</option>
          </select></div>
        <div><label for="fSev">Importancia</label><select id="fSev">
            <option value="">Todas</option>
            <option value="critico">Crítico</option>
            <option value="aviso">Atención</option>
            <option value="info">Normal</option>
          </select></div>
        <div><label for="fTxt">Usuario o dato</label><input id="fTxt" placeholder="usuario, cédula, código…"
            autocomplete="off"></div>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="fPend"> Solo pendientes de revisar</label>
        <button class="btn" id="bBuscar">Buscar</button>
        <button class="btn o" id="bLimpiar">Limpiar</button>
        <button class="btn o" id="bExcel" style="margin-left:auto">📥 Exportar a Excel</button>
      </div>
    </section>

    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>Cuándo</th>
            <th>Quién</th>
            <th>Dónde</th>
            <th>Acción</th>
            <th>Qué pasó</th>
            <th>Importancia</th>
            <th>Revisión</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="pg" id="pg"></div>
  </main>

  <div class="ov" id="ov">
    <div class="card" id="card" role="dialog" aria-modal="true"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const POR = 50, ACC = { insert: 'Creó', update: 'Modificó', delete: 'Eliminó', evento: 'Evento' };
    const SEV = { info: 'Normal', aviso: 'Atención', critico: 'Crítico' };
    let pag = 1, total = 0, filas = [];
    const fmt = d => new Date(d).toLocaleString(window.idiomaActual && idiomaActual() === 'zh' ? 'zh-CN' : 'es-VE', { dateStyle: 'short', timeStyle: 'medium' });
    const cut = (s, n) => s.length > n ? s.slice(0, n) + '…' : s;

    /* ---------- Diccionarios: nombres que entiende cualquier usuario ---------- */
    /* [nombre en pantalla, cómo se nombra "un/una ..." en la frase] */
    const TABLAS = {
      recepcion_fechas: ['Recepción y vencimientos', 'un registro de recepción'],
      descuento_empleados: ['Descuentos a empleados', 'un descuento de empleado'],
      empleados: ['Empleados', 'un empleado'],
      articulos: ['Artículos', 'un artículo'],
      insumos: ['Insumos', 'un insumo'],
      recetas: ['Recetas', 'una receta'],
      evento: ['Eventos del sistema', 'un evento']
    };
    /* Agrega aquí las columnas reales de tus tablas. Las que falten se muestran igual, "prettificadas". */
    const CAMPOS = {
      costo_venta: 'Costo de venta', costo: 'Costo', precio: 'Precio', historial: 'Historial de cambios',
      inhabilitado: 'Inhabilitado', nombre: 'Nombre', producto: 'Producto', descripcion: 'Descripción',
      cedula: 'Cédula', unidad: 'Unidad', cantidad: 'Cantidad', lote: 'Lote', vencimiento: 'Fecha de vencimiento',
      motivo: 'Motivo', usuario: 'Usuario', fecha: 'Fecha', costoNuevo: 'Costo nuevo', costoVentaNuevo: 'Costo de venta nuevo',
      categoria: 'Categoría', proveedor: 'Proveedor', monto: 'Monto', nombre_empleado: 'Nombre del empleado',
      nombre_apellido: 'Nombre y apellido', codigo: 'Código', estado: 'Estado'
    };
    const OCULTOS = ['id', 'created_at', 'updated_at', 'creado_en'];
    const campo = k => CAMPOS[k] || String(k).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
    const tabla = t => (TABLAS[t] || [t])[0];
    const quien = a => a.usuario_nombre || (a.usuario_email || 'Sistema').split('@')[0];
    const corto = e => (e || '').split('@')[0];
    const nav = u => {
      u = u || '';
      const b = /Edg\//.test(u) ? 'Edge' : /OPR\//.test(u) ? 'Opera' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Navegador';
      const s = /Windows/.test(u) ? 'Windows' : /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iOS' : /Mac OS/.test(u) ? 'Mac' : /Linux/.test(u) ? 'Linux' : '';
      return s ? `${b} en ${s}` : b
    };

    /* Valor legible */
    const fv = v => {
      if (v === null || v === undefined || v === '') return '(vacío)';
      if (v === true) return 'Sí'; if (v === false) return 'No';
      if (typeof v === 'number') return v.toLocaleString('es-VE');
      if (typeof v === 'object') return JSON.stringify(v);
      if (/^\d{4}-\d{2}-\d{2}T/.test(v)) return fmt(v);
      return String(v)
    };
    /* Un objeto como "Campo: valor · Campo: valor" */
    const fe = o => o && typeof o === 'object'
      ? Object.entries(o).filter(([k]) => !OCULTOS.includes(k)).map(([k, v]) => `<span><em>${esc(campo(k))}:</em> ${esc(fv(v))}</span>`).join(' · ')
      : esc(fv(o));
    /* Nombre del elemento afectado */
    const nombreDe = a => {
      const o = a.despues || a.antes || {};
      return o.producto || o.nombre || o.descripcion || o.nombre_empleado || o.nombre_apellido || o.cedula || ''
    };

    /* Un campo que cambió: "Costo de venta  1,2 → 1,22" */
    function cambio(k, x, y) {
      if (Array.isArray(x) || Array.isArray(y)) {
        const viejos = (x || []).map(j => JSON.stringify(j));
        const nuevos = (y || []).filter(j => !viejos.includes(JSON.stringify(j)));
        return `<div class="ch"><b>${esc(campo(k))}</b><span>${nuevos.length ? 'Se agregó:' : 'Se modificaron entradas anteriores'}</span>${nuevos.map(n => `<div class="ent">${fe(n)}</div>`).join('')}</div>`
      }
      return `<div class="ch"><b>${esc(campo(k))}</b><span class="old">${esc(fv(x))}</span><span class="ar">→</span><span class="new">${esc(fv(y))}</span></div>`
    }
    /* Un dato simple: "Cédula  12345678" */
    const dato = (k, v) => `<div class="ch"><b>${esc(campo(k))}</b><span class="val">${Array.isArray(v) ? '' : esc(fv(v))}</span>${Array.isArray(v) ? v.map(n => `<div class="ent">${fe(n)}</div>`).join('') : ''}</div>`;

    /* Tema compartido con los demás módulos */
    function tema(d) { document.body.classList.toggle('dark', d); $('tema').textContent = d ? '☀️' : '🌙' }
    tema(localStorage.getItem('hipergalerias_theme') === 'dark');
    $('tema').onclick = () => { const d = !document.body.classList.contains('dark'); localStorage.setItem('hipergalerias_theme', d ? 'dark' : 'light'); tema(d) };

    /* Filtro "Qué se modificó" con nombres legibles */
    $('fTabla').innerHTML = '<option value="">Todo</option>' + Object.entries(TABLAS).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('');

    /* Resumen legible de una fila */
    function resumen(a) {
      const o = a.despues || a.antes || {};
      if (a.accion === 'evento') return esc(`${o.tipo || 'Evento'}: ${o.detalle || ''}`);
      const nom = nombreDe(a);
      if (a.accion === 'update') {
        const cs = (a.campos_cambiados || []).filter(c => !OCULTOS.includes(c)).map(c => esc(campo(c).toLowerCase())).join(', ');
        return `<b>${esc(nom)}</b>${cs ? ' · cambió ' + cs : ''}`
      }
      return `<b>${esc(nom)}</b>`;
    }

    /* Construye la consulta con los filtros */
    function consulta(sel, opts) {
      let q = supabaseClient.from('auditoria').select(sel, opts);
      const g = id => $(id).value.trim();
      if (g('fDesde')) q = q.gte('creado_en', g('fDesde') + 'T00:00:00');
      if (g('fHasta')) q = q.lte('creado_en', g('fHasta') + 'T23:59:59');
      if (g('fMod')) q = q.eq('modulo', g('fMod'));
      if (g('fTabla')) q = q.eq('tabla', g('fTabla'));
      if (g('fAcc')) q = q.eq('accion', g('fAcc'));
      if (g('fSev')) q = q.eq('severidad', g('fSev'));
      if ($('fPend').checked) q = q.neq('severidad', 'info').is('revisado_en', null);
      const t = g('fTxt').replace(/[%,()*"\\]/g, ' ').trim();
      if (t) q = q.or(`usuario_email.ilike."%${t}%",usuario_nombre.ilike."%${t}%",registro_id.ilike."%${t}%",tabla.ilike."%${t}%"`);
      return q;
    }

    async function buscar() {
      $('tb').innerHTML = '<tr><td colspan="7" class="empty">Cargando…</td></tr>';
      const d = (pag - 1) * POR;
      const { data, count, error } = await consulta('*', { count: 'exact' }).order('creado_en', { ascending: false }).range(d, d + POR - 1);
      if (error) { $('tb').innerHTML = `<tr><td colspan="7" class="empty">No se pudo leer la auditoría: ${esc(error.message)}</td></tr>`; return }
      filas = data || []; total = count || 0;
      $('tb').innerHTML = filas.length ? filas.map((a, i) => {
        const pend = a.severidad !== 'info' && !a.revisado_en;
        return `<tr class="${pend ? 'pend' : ''}" data-i="${i}" tabindex="0"><td>${fmt(a.creado_en)}</td><td>${esc(quien(a))}</td>
    <td>${esc(tabla(a.tabla))} <small style="color:var(--mu)">${esc(a.modulo || '')}</small></td>
    <td><span class="b ${a.accion}">${ACC[a.accion] || a.accion}</span></td><td class="res">${resumen(a)}</td>
    <td><span class="b ${a.severidad}">${SEV[a.severidad] || a.severidad}</span></td>
    <td>${a.severidad === 'info' ? '—' : a.revisado_en ? '✅ ' + esc(corto(a.revisado_por)) : '⏳ Pendiente'}</td></tr>`
      }).join('')
        : '<tr><td colspan="7" class="empty"><strong>Sin resultados</strong><br>Ajusta los filtros o el rango de fechas.</td></tr>';
      const tp = Math.max(1, Math.ceil(total / POR));
      $('pg').innerHTML = total ? `<div>Mostrando <strong>${d + 1}-${Math.min(d + POR, total)}</strong> de <strong>${total.toLocaleString()}</strong> eventos</div>
  <div><button class="btn o" id="pP" ${pag <= 1 ? 'disabled' : ''}>◀ Anterior</button> Página <strong>${pag}</strong> de ${tp} <button class="btn o" id="pN" ${pag >= tp ? 'disabled' : ''}>Siguiente ▶</button></div>` : '';
      if ($('pP')) $('pP').onclick = () => { pag--; buscar() };
      if ($('pN')) $('pN').onclick = () => { pag++; buscar() };
    }

    async function kpis() {
      const c = q => q.then(r => r.count ?? 0);
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0); const sem = new Date(hoy); sem.setDate(sem.getDate() - 6);
      const base = () => supabaseClient.from('auditoria').select('id', { count: 'exact', head: true });
      const [a, b, k] = await Promise.all([c(base().gte('creado_en', hoy.toISOString())), c(base().gte('creado_en', sem.toISOString())), c(base().neq('severidad', 'info').is('revisado_en', null))]);
      $('kHoy').textContent = a.toLocaleString(); $('kSem').textContent = b.toLocaleString(); $('kCrit').textContent = k.toLocaleString();
    }

    /* Detalle en lenguaje claro */
    function abrir(a) {
      const antes = a.antes || {}, desp = a.despues || {};
      const nom = nombreDe(a);
      const verbo = { insert: 'creó', update: 'modificó', delete: 'eliminó' }[a.accion];
      const frase = a.accion === 'evento'
        ? `${esc(quien(a))} registró: ${esc(((desp.tipo || '') + ' ' + (desp.detalle || '')).trim())}`
        : `${esc(quien(a))} ${verbo} ${(TABLAS[a.tabla] || [, 'un registro'])[1]}${nom ? ` <u>${esc(nom)}</u>` : ''}`;
      let titulo = '', cuerpo = '';
      if (a.accion === 'update') {
        titulo = '¿Qué cambió?';
        cuerpo = (a.campos_cambiados || []).filter(k => !OCULTOS.includes(k)).map(k => cambio(k, antes[k], desp[k])).join('');
      } else if (a.accion !== 'evento') {
        const src = a.accion === 'delete' ? antes : desp;
        titulo = a.accion === 'delete' ? 'Datos que se eliminaron' : 'Datos registrados';
        cuerpo = Object.keys(src).filter(k => !OCULTOS.includes(k) && src[k] !== null && src[k] !== '').map(k => dato(k, src[k])).join('');
      }
      $('card').innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
    <span class="b ${a.severidad}">${SEV[a.severidad] || a.severidad}</span><button class="btn o" id="xC" aria-label="Cerrar">✕</button></div>
  <div class="frase">${frase}</div>
  <div class="meta">
    <div><small>Cuándo</small>${fmt(a.creado_en)}</div>
    <div><small>Dónde</small>${esc(a.modulo || '—')} › ${esc(tabla(a.tabla))}</div></div>
  <div class="why">${a.motivo ? 'Motivo: ' + esc(a.motivo) : 'No se indicó el motivo de este cambio'}</div>
  ${cuerpo ? `<h4 class="sub">${titulo}</h4>${cuerpo}` : ''}
  <details class="tec"><summary>Detalles técnicos</summary>
    <div style="margin-top:8px">Dispositivo: ${esc(nav(a.user_agent))} · IP: ${esc(a.ip || 'no disponible')}<br>Correo: ${esc(a.usuario_email || 'Sistema')}<br>Registro: ${esc(a.tabla)} #${esc(a.registro_id || '—')}</div></details>
  <div class="row" style="justify-content:flex-end">
   ${a.registro_id && a.tabla !== 'evento' ? `<button class="btn o" id="xH">Ver todo el historial de este registro</button>` : ''}
   ${a.severidad !== 'info' && !a.revisado_en ? `<button class="btn" id="xR">✔ Marcar como revisado</button>` : a.revisado_en ? `<span class="chip">Revisado por ${esc(corto(a.revisado_por))} · ${fmt(a.revisado_en)}</span>` : ''}</div>`;
      $('ov').classList.add('on');
      $('xC').onclick = cerrar;
      if ($('xH')) $('xH').onclick = () => { cerrar(); $('fTabla').value = a.tabla; $('fTxt').value = a.registro_id; $('fDesde').value = $('fHasta').value = ''; pag = 1; buscar() };
      if ($('xR')) $('xR').onclick = async () => {
        const { error } = await supabaseClient.rpc('marcar_revisado', { p_id: a.id });
        if (error) { alert('No se pudo marcar: ' + error.message); return }
        cerrar(); buscar(); kpis();
      };
    }
    const cerrar = () => $('ov').classList.remove('on');
    $('ov').onclick = e => { if (e.target === $('ov')) cerrar() };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar() });
    $('tb').addEventListener('click', e => { const r = e.target.closest('tr[data-i]'); if (r) abrir(filas[r.dataset.i]) });
    $('tb').addEventListener('keydown', e => { if (e.key === 'Enter') { const r = e.target.closest('tr[data-i]'); if (r) abrir(filas[r.dataset.i]) } });

    $('bBuscar').onclick = () => { pag = 1; buscar() };
    $('fTxt').addEventListener('keydown', e => { if (e.key === 'Enter') { pag = 1; buscar() } });
    $('bLimpiar').onclick = () => { document.querySelectorAll('.filters input,.filters select').forEach(i => i.value = ''); $('fPend').checked = false; pag = 1; buscar() };
    $('kCritCard').onclick = () => { $('fPend').checked = true; pag = 1; buscar() };

    $('bExcel').onclick = async () => {
      $('bExcel').disabled = true;
      const { data, error } = await consulta('*').order('creado_en', { ascending: false }).limit(5000);
      $('bExcel').disabled = false;
      if (error || !data?.length) { alert(error ? error.message : 'No hay eventos con este filtro.'); return }
      const T = window.i18nTr || (x => x);
      const hoja = data.map(a => ({
        [T('Fecha')]: fmt(a.creado_en), [T('Usuario')]: quien(a), [T('Correo')]: a.usuario_email || '', [T('Módulo')]: T(a.modulo || ''),
        [T('Qué se modificó')]: T(tabla(a.tabla)), [T('Elemento')]: nombreDe(a), [T('Acción')]: T(ACC[a.accion] || a.accion),
        [T('Campos cambiados')]: (a.campos_cambiados || []).map(c => T(campo(c))).join(', '),
        [T('Antes')]: cut(a.antes ? JSON.stringify(a.antes) : '', 30000), [T('Después')]: cut(a.despues ? JSON.stringify(a.despues) : '', 30000),
        [T('Motivo')]: a.motivo || '', [T('Importancia')]: T(SEV[a.severidad] || a.severidad), IP: a.ip || '',
        [T('Revisado')]: a.revisado_en ? corto(a.revisado_por) + ' ' + fmt(a.revisado_en) : ''
      }));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hoja), T('Auditoría'));
      XLSX.writeFile(wb, `auditoria_${new Date().toISOString().slice(0, 10)}.xlsx`);
      supabaseClient.rpc('registrar_evento', { p_tipo: 'Exportación', p_detalle: `Excel de auditoría (${data.length} filas)`, p_modulo: 'Auditoría' });
    };

    /* Acceso: solo auditor / admin. La RLS de Supabase es la protección real. */
    (async () => {
      if (typeof supabaseClient === 'undefined') { location.href = 'index.html'; return }
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { location.href = 'index.html'; return }
      const { data: p } = await supabaseClient.from('perfiles').select('rol').eq('id', session.user.id).maybeSingle();
      if (!p || !['auditor', 'admin'].includes(p.rol)) { location.href = 'index.html'; return }
      const m = session.user.user_metadata || {};
      const nombre = m.display_name || m.nombre || m.full_name || m.name || corto(session.user.email);
      $('quien').textContent = `${nombre} · ${p.rol}`;
      supabaseClient.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.href = 'index.html' });
      await Promise.all([buscar(), kpis()]);
      $('gate').classList.add('done');
    })();
  </script>
  <script src="i18n.js"></script>
</body>

</html>
