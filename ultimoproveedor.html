<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Último proveedor - Hipergalerias</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="conexion.js"></script>
<style>
:root{--bg:#f4f6f3;--sf:#fff;--ln:#dfe6e0;--tx:#17231b;--mu:#5d6f63;--g:#166534;--gold:#f4b400;--mint:#e8f4ec}
body.dark{--bg:#0c1511;--sf:#121e19;--ln:#233a30;--tx:#e8f2ec;--mu:#9bb2a5;--g:#1f8a4c;--mint:#163a28}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:14px;padding:10px 28px;background:var(--sf);border-bottom:3px solid var(--gold)}
header img{height:42px}header h1{margin:0;font-size:1.05rem}
.back{padding:8px 14px;border:1px solid var(--ln);border-radius:99px;color:var(--g);font-weight:700;text-decoration:none}
main{max-width:820px;margin:0 auto;padding:24px 20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:20px;margin-bottom:18px}
h2{margin:0 0 12px;font-size:1.05rem}
input[type=text]{padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);width:240px}
button,.btn{border:0;border-radius:99px;padding:10px 18px;font-weight:700;background:var(--g);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.res{margin-top:12px;padding:10px 14px;background:var(--mint);border-radius:8px;font-weight:600;display:none}
.mu{color:var(--mu);font-size:.85rem}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← Inicio</a>
  <img src="logo.png" alt="Hipergalerias" onerror="this.onerror=null;this.src='logo.jpeg'">
  <h1>Último proveedor por código</h1>
</header>
<main>
  <section class="card">
    <h2>Consulta individual</h2>
    <input type="text" id="cod" placeholder="Código, ej. 000641" autocomplete="off">
    <button id="bUno">Buscar</button>
    <div class="res" id="rUno"></div>
  </section>

  <section class="card">
    <h2>Consulta en lote (Excel)</h2>
    <p class="mu">Sube el Excel con los códigos en la <b>columna C</b>. Se descarga el mismo archivo con el proveedor en la <b>columna J</b>.</p>
    <input type="file" id="file" accept=".xlsx,.xls">
    <div class="res" id="rLote"></div>
  </section>
  <p class="mu" id="sync"></p>
</main>

<script>
const $ = id => document.getElementById(id);
const COL_COD = 2, COL_OUT = 9;               // C y J
const ENCABEZADO = 'COD+PROVEEDOR';

if (localStorage.getItem('hipergalerias_theme') === 'dark') document.body.classList.add('dark');

// El código siempre es texto de al menos 6 dígitos (000641). Los de 12 dígitos se dejan tal cual.
const norm = v => {
  const s = String(v ?? '').trim();
  return /^\d+$/.test(s) && s.length < 6 ? s.padStart(6, '0') : s;
};

async function buscar(codigos) {
  const mapa = new Map(), lista = [...new Set(codigos)];
  for (let i = 0; i < lista.length; i += 150) {
    const { data, error } = await supabaseClient.from('ultimo_proveedor')
      .select('item_id,proveedor').in('item_id', lista.slice(i, i + 150));
    if (error) throw error;
    (data || []).forEach(r => mapa.set(r.item_id, r.proveedor));
  }
  return mapa;
}

function mostrar(el, txt) { el.textContent = txt; el.style.display = 'block'; }

// ---- Consulta individual ----
async function uno() {
  const c = norm($('cod').value); if (!c) return;
  try {
    const m = await buscar([c]);
    mostrar($('rUno'), m.get(c) || 'SIN PROVEEDOR');
  } catch (e) { mostrar($('rUno'), 'Error: ' + e.message); }
}
$('bUno').onclick = uno;
$('cod').addEventListener('keydown', e => { if (e.key === 'Enter') uno(); });

// ---- Consulta en lote ----
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  mostrar($('rLote'), 'Procesando…');
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rng = XLSX.utils.decode_range(ws['!ref']);

    // Fila de encabezado: la primera (en las 10 primeras) con "cod" en la columna C
    let h = 0;
    for (let r = 0; r <= Math.min(9, rng.e.r); r++) {
      const c = ws[XLSX.utils.encode_cell({ r, c: COL_COD })];
      if (c && /^cod/i.test(String(c.v).trim())) { h = r; break; }
    }

    const filas = [];
    for (let r = h + 1; r <= rng.e.r; r++) {
      const c = ws[XLSX.utils.encode_cell({ r, c: COL_COD })];
      filas.push({ r, cod: c ? norm(c.v) : '' });
    }
    const mapa = await buscar(filas.map(x => x.cod).filter(Boolean));

    ws[XLSX.utils.encode_cell({ r: h, c: COL_OUT })] = { t: 's', v: ENCABEZADO };
    let ok = 0, sin = 0;
    filas.forEach(({ r, cod }) => {
      if (!cod) return;
      const p = mapa.get(cod);
      p ? ok++ : sin++;
      ws[XLSX.utils.encode_cell({ r, c: COL_OUT })] = { t: 's', v: p || 'SIN PROVEEDOR' };
    });
    rng.e.c = Math.max(rng.e.c, COL_OUT);
    ws['!ref'] = XLSX.utils.encode_range(rng);
    ws['!cols'] = ws['!cols'] || [];
    ws['!cols'][COL_OUT] = { wch: 48 };

    XLSX.writeFile(wb, f.name.replace(/\.(xlsx|xls)$/i, '') + '_proveedores.xlsx');
    mostrar($('rLote'), `Listo: ${ok} con proveedor, ${sin} sin proveedor.`);
  } catch (err) { mostrar($('rLote'), 'Error: ' + err.message); }
  e.target.value = '';
});

// ---- Sesión ----
(async () => {
  if (typeof supabaseClient === 'undefined') { location.href = 'index.html'; return; }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  supabaseClient.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.href = 'index.html'; });
  const { data } = await supabaseClient.from('ultimo_proveedor').select('updated_at').order('updated_at', { ascending: false }).limit(1);
  if (data && data[0]) $('sync').textContent = 'Datos actualizados: ' + new Date(data[0].updated_at).toLocaleString('es-VE');
})();
</script>
</body>
</html>
