<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Último proveedor - Hipergalerias</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="conexion.js"></script>
  <style>
    :root {
      --bg: #f4f6f3;
      --sf: #fff;
      --ln: #dfe6e0;
      --tx: #17231b;
      --mu: #5d6f63;
      --g: #166534;
      --g2: #22a04c;
      --gold: #f4b400;
      --mint: #e8f4ec;
      --red: #c8372d;
      --gray: #b9c4bd;
      --ease: cubic-bezier(.22, .8, .3, 1)
    }

    body.dark {
      --bg: #0c1511;
      --sf: #121e19;
      --ln: #233a30;
      --tx: #e8f2ec;
      --mu: #9bb2a5;
      --g: #1f8a4c;
      --mint: #163a28;
      --gray: #3a4d43
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 14px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
      animation: fade .5s
    }

    @keyframes fade {
      from {
        opacity: 0
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes stripes {
      to {
        background-position: 28px 0
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.92)
      }
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 28px;
      background: var(--sf);
      border-bottom: 3px solid var(--gold)
    }

    header img {
      height: 42px
    }

    header h1 {
      margin: 0;
      font-size: 1.05rem
    }

    .back {
      padding: 8px 14px;
      border: 1px solid var(--ln);
      border-radius: 99px;
      color: var(--g);
      font-weight: 700;
      text-decoration: none;
      transition: .2s
    }

    .back:hover {
      background: var(--mint)
    }

    .chip {
      margin-left: auto;
      padding: 6px 14px;
      border: 1px solid var(--ln);
      border-radius: 99px;
      background: var(--mint);
      font-weight: 600;
      font-size: .82rem
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 20px
    }

    .card {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(18, 62, 27, .07);
      animation: rise .5s var(--ease) both
    }

    .card:nth-of-type(2) {
      animation-delay: .1s
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.05rem
    }

    .mu {
      color: var(--mu);
      font-size: .86rem
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    input[type=text] {
      flex: 1;
      min-width: 200px;
      padding: 11px 14px;
      border: 1px solid var(--ln);
      border-radius: 10px;
      background: var(--sf);
      color: var(--tx);
      font-size: 1rem;
      transition: .2s
    }

    input[type=text]:focus {
      outline: none;
      border-color: var(--g2);
      box-shadow: 0 0 0 4px rgba(34, 160, 76, .18)
    }

    button {
      border: 0;
      border-radius: 99px;
      padding: 11px 20px;
      font-weight: 700;
      background: var(--g);
      color: #fff;
      cursor: pointer;
      transition: transform .15s, filter .2s
    }

    button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px)
    }

    button:active {
      transform: scale(.97)
    }

    button.o {
      background: transparent;
      color: var(--tx);
      border: 1px solid var(--ln)
    }

    .out {
      margin-top: 14px;
      display: none;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--mint);
      border-left: 5px solid var(--g2);
      animation: pop .3s var(--ease)
    }

    .out.no {
      border-left-color: var(--red)
    }

    .out .id {
      min-width: 52px;
      text-align: center;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--g);
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem
    }

    .out.no .id {
      background: var(--red)
    }

    .out b {
      font-size: 1.02rem
    }

    .drop {
      display: block;
      border: 2px dashed var(--gray);
      border-radius: 14px;
      padding: 34px 16px;
      text-align: center;
      cursor: pointer;
      transition: .25s;
      background: var(--bg)
    }

    .drop:hover,
    .drop.over {
      border-color: var(--g2);
      background: var(--mint);
      transform: scale(1.01)
    }

    .drop .ic {
      font-size: 2.4rem;
      display: block;
      margin-bottom: 6px;
      transition: transform .3s var(--ease)
    }

    .drop.over .ic {
      transform: translateY(-6px) scale(1.15)
    }

    .drop input {
      display: none
    }

    .steps {
      display: none;
      margin: 18px 0 8px;
      gap: 8px;
      justify-content: space-between
    }

    .step {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--ln);
      color: var(--mu);
      font-weight: 600;
      font-size: .84rem;
      transition: .3s
    }

    .step i {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ln);
      font-style: normal;
      font-size: .78rem;
      flex: none
    }

    .step.on {
      border-color: var(--g2);
      color: var(--tx);
      background: var(--mint)
    }

    .step.on i {
      background: transparent;
      border: 3px solid var(--g2);
      border-top-color: transparent;
      animation: spin .8s linear infinite
    }

    .step.ok {
      color: var(--tx)
    }

    .step.ok i {
      background: var(--g2);
      color: #fff
    }

    .bar {
      display: none;
      height: 14px;
      border-radius: 99px;
      background: var(--ln);
      overflow: hidden;
      margin-top: 10px
    }

    .bar>div {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: repeating-linear-gradient(115deg, var(--g2) 0 14px, var(--g) 14px 28px);
      background-size: 28px 100%;
      animation: stripes .6s linear infinite;
      transition: width .3s var(--ease)
    }

    .bar.done>div {
      animation: none;
      background: var(--g2)
    }

    .pinfo {
      display: none;
      justify-content: space-between;
      margin-top: 6px;
      font-weight: 600;
      font-size: .84rem
    }

    .stats {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px
    }

    .stat {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--ln);
      border-top: 4px solid var(--g2);
      text-align: center;
      animation: pop .4s var(--ease) both
    }

    .stat:nth-child(2) {
      border-top-color: var(--gray);
      animation-delay: .08s
    }

    .stat:nth-child(3) {
      border-top-color: var(--gold);
      animation-delay: .16s
    }

    .stat b {
      display: block;
      font-size: 1.8rem;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums
    }

    .stat small {
      color: var(--mu);
      font-weight: 600
    }

    .ratio {
      display: none;
      height: 12px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--gray);
      margin-top: 14px
    }

    .ratio>div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--g), var(--g2));
      transition: width 1s var(--ease)
    }

    .tw {
      display: none;
      margin-top: 16px;
      border: 1px solid var(--ln);
      border-radius: 12px;
      overflow: auto;
      max-height: 300px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .84rem
    }

    th,
    td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--ln);
      white-space: nowrap
    }

    th {
      position: sticky;
      top: 0;
      background: var(--mint);
      color: var(--g)
    }

    body.dark th {
      color: #9ae8b8
    }

    tbody tr {
      animation: rise .35s both;
      animation-delay: calc(var(--i)*40ms)
    }

    td.sp {
      color: var(--red);
      font-weight: 700
    }

    .acts {
      display: none;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap
    }

    #sync {
      display: flex;
      align-items: center;
      gap: 8px
    }

    #sync i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--g2);
      box-shadow: 0 0 0 0 rgba(34, 160, 76, .6);
      animation: ping 2s infinite
    }

    @keyframes ping {
      70% {
        box-shadow: 0 0 0 8px rgba(34, 160, 76, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(34, 160, 76, 0)
      }
    }

    @media(max-width:640px) {
      .steps {
        flex-direction: column
      }

      .stats {
        grid-template-columns: 1fr
      }

      header,
      main {
        padding-left: 14px;
        padding-right: 14px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="back" href="index.html">← Inicio</a>
    <img src="logo.png" alt="Hipergalerias" onerror="this.onerror=null;this.src='logo.jpeg'">
    <h1>Último proveedor por código</h1>
    <span class="chip" id="quien">…</span>
  </header>
  <main>
    <section class="card">
      <h2>🔎 Consulta individual</h2>
      <div class="row">
        <input type="text" id="cod" placeholder="Código, ej. 000641" autocomplete="off">
        <button id="bUno">Buscar</button>
      </div>
      <div class="out" id="rUno"><span class="id" id="rId"></span><b id="rNom"></b></div>
    </section>

    <section class="card">
      <h2>📊 Consulta en lote (Excel)</h2>
      <label class="drop" id="drop">
        <span class="ic">📥</span>
        <b>Arrastra tu Excel aquí o haz clic para elegirlo</b>
        <div class="mu">Códigos en la columna C · el proveedor se escribe en la columna J</div>
        <input type="file" id="file" accept=".xlsx,.xls,.csv">
      </label>

      <div class="steps" id="steps">
        <div class="step" data-s="1"><i>1</i>Leer archivo</div>
        <div class="step" data-s="2"><i>2</i>Consultar proveedores</div>
        <div class="step" data-s="3"><i>3</i>Generar Excel</div>
      </div>
      <div class="bar" id="bar">
        <div id="barIn"></div>
      </div>
      <div class="pinfo" id="pinfo"><span id="ptxt"></span><span id="ppct">0%</span></div>

      <div class="stats" id="stats">
        <div class="stat"><b id="nOk">0</b><small>✅ Con proveedor</small></div>
        <div class="stat"><b id="nNo">0</b><small>➖ Sin proveedor</small></div>
        <div class="stat"><b id="nTot">0</b><small>📄 Códigos revisados</small></div>
      </div>
      <div class="ratio" id="ratio">
        <div id="ratioIn"></div>
      </div>

      <div class="tw" id="tw">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Artículo</th>
              <th>Último proveedor</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
      <div class="acts" id="acts">
        <button id="bDown">⬇️ Descargar de nuevo</button>
        <button class="o" id="bOtro">Procesar otro archivo</button>
      </div>
    </section>
    <p class="mu" id="sync"><i></i><span></span></p>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const COL_COD = 2, COL_NOM = 1, COL_OUT = 9, ENCABEZADO = 'COD+PROVEEDOR';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const wait = ms => new Promise(r => setTimeout(r, ms));
    let ultimo = null; // { wb, nombre }

    if (localStorage.getItem('hipergalerias_theme') === 'dark') document.body.classList.add('dark');

    const norm = v => { const s = String(v ?? '').trim(); return /^\d+$/.test(s) && s.length < 6 ? s.padStart(6, '0') : s; };

    async function buscar(codigos, onProg) {
      const mapa = new Map(), lista = [...new Set(codigos)];
      for (let i = 0; i < lista.length; i += 150) {
        const { data, error } = await supabaseClient.from('ultimo_proveedor')
          .select('item_id,proveedor').in('item_id', lista.slice(i, i + 150));
        if (error) throw error;
        (data || []).forEach(r => mapa.set(r.item_id, r.proveedor));
        if (onProg) onProg(Math.min(i + 150, lista.length), lista.length);
      }
      return mapa;
    }

    function contar(el, hasta) {
      const t0 = performance.now();
      (function p(t) {
        const k = Math.min(1, (t - t0) / 900);
        el.textContent = Math.round(hasta * (1 - Math.pow(1 - k, 3))).toLocaleString('es-VE');
        if (k < 1) requestAnimationFrame(p);
      })(t0);
    }

    /* ---- Consulta individual ---- */
    async function uno() {
      const c = norm($('cod').value); if (!c) return;
      const box = $('rUno');
      try {
        const p = (await buscar([c])).get(c);
        box.classList.toggle('no', !p);
        $('rId').textContent = p ? p.split(' ~ ')[0] : '—';
        $('rNom').textContent = p ? p.split(' ~ ').slice(1).join(' ~ ') : 'SIN PROVEEDOR';
      } catch (e) { box.classList.add('no'); $('rId').textContent = '!'; $('rNom').textContent = 'Error: ' + e.message; }
      box.style.display = 'none'; void box.offsetWidth; box.style.display = 'flex';
    }
    $('bUno').onclick = uno;
    $('cod').addEventListener('keydown', e => { if (e.key === 'Enter') uno(); });

    /* ---- Progreso ---- */
    function paso(n) {
      document.querySelectorAll('.step').forEach(s => {
        const k = +s.dataset.s;
        s.classList.toggle('ok', k < n || n > 3);
        s.classList.toggle('on', k === n);
        s.firstChild.textContent = k < n || n > 3 ? '✓' : k;
      });
    }
    function progreso(pct, txt) {
      $('barIn').style.width = pct + '%';
      $('ppct').textContent = Math.round(pct) + '%';
      if (txt) $('ptxt').textContent = txt;
    }
    function reiniciar() {
      ['steps', 'bar', 'pinfo', 'stats', 'ratio', 'tw', 'acts'].forEach(i => $(i).style.display = 'none');
      $('bar').classList.remove('done'); $('ratioIn').style.width = '0';
      $('drop').style.display = '';
    }

    /* ---- Consulta en lote ---- */
    async function procesar(f) {
      reiniciar();
      const t0 = performance.now();
      $('drop').style.display = 'none';
      $('steps').style.display = 'flex'; $('bar').style.display = 'block'; $('pinfo').style.display = 'flex';
      try {
        paso(1); progreso(5, 'Leyendo «' + f.name + '»…'); await wait(60);
        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rng = XLSX.utils.decode_range(ws['!ref']);
        let h = 0;
        for (let r = 0; r <= Math.min(9, rng.e.r); r++) {
          const c = ws[XLSX.utils.encode_cell({ r, c: COL_COD })];
          if (c && /^cod/i.test(String(c.v).trim())) { h = r; break; }
        }
        const filas = [];
        for (let r = h + 1; r <= rng.e.r; r++) {
          const c = ws[XLSX.utils.encode_cell({ r, c: COL_COD })], n = ws[XLSX.utils.encode_cell({ r, c: COL_NOM })];
          filas.push({ r, cod: c ? norm(c.v) : '', nom: n ? String(n.v) : '' });
        }

        paso(2);
        const mapa = await buscar(filas.map(x => x.cod).filter(Boolean), (a, b) =>
          progreso(10 + a / b * 75, 'Consultando proveedores: ' + a.toLocaleString('es-VE') + ' de ' + b.toLocaleString('es-VE') + ' códigos'));

        paso(3); progreso(90, 'Generando el Excel…'); await wait(60);
        ws[XLSX.utils.encode_cell({ r: h, c: COL_OUT })] = { t: 's', v: ENCABEZADO };
        let ok = 0, sin = 0; const prev = [];
        filas.forEach(({ r, cod, nom }) => {
          if (!cod) return;
          const p = mapa.get(cod);
          p ? ok++ : sin++;
          ws[XLSX.utils.encode_cell({ r, c: COL_OUT })] = { t: 's', v: p || 'SIN PROVEEDOR' };
          if (prev.length < 10) prev.push({ cod, nom, p });
        });
        rng.e.c = Math.max(rng.e.c, COL_OUT);
        ws['!ref'] = XLSX.utils.encode_range(rng);
        ws['!cols'] = ws['!cols'] || []; ws['!cols'][COL_OUT] = { wch: 48 };

        ultimo = { wb, nombre: f.name.replace(/\.(xlsx|xls|csv)$/i, '') + '_proveedores.xlsx' };
        XLSX.writeFile(wb, ultimo.nombre);
        paso(4); progreso(100, '¡Listo en ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s!');
        $('bar').classList.add('done');

        $('stats').style.display = 'grid'; $('ratio').style.display = 'block';
        contar($('nOk'), ok); contar($('nNo'), sin); contar($('nTot'), ok + sin);
        requestAnimationFrame(() => $('ratioIn').style.width = (ok + sin ? ok / (ok + sin) * 100 : 0) + '%');
        $('tb').innerHTML = prev.map((x, i) => `<tr style="--i:${i}"><td><b>${esc(x.cod)}</b></td><td>${esc(x.nom)}</td><td class="${x.p ? '' : 'sp'}">${esc(x.p || 'SIN PROVEEDOR')}</td></tr>`).join('');
        $('tw').style.display = 'block'; $('acts').style.display = 'flex';
      } catch (err) {
        progreso(0, 'Error: ' + err.message); $('acts').style.display = 'flex';
      }
    }

    const drop = $('drop');
    $('file').addEventListener('change', e => { if (e.target.files[0]) procesar(e.target.files[0]); e.target.value = ''; });
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) procesar(e.dataTransfer.files[0]); });
    $('bDown').onclick = () => { if (ultimo) XLSX.writeFile(ultimo.wb, ultimo.nombre); };
    $('bOtro').onclick = reiniciar;

    /* ---- Sesión ---- */
    (async () => {
      if (typeof supabaseClient === 'undefined') { location.href = 'index.html'; return; }
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { location.href = 'index.html'; return; }
      const { data: perfil } = await supabaseClient.from('perfiles').select('rol').eq('id', session.user.id).maybeSingle();
      if (!perfil || !['admin', 'proveedores'].includes(perfil.rol)) { location.href = 'index.html'; return; }
      const m = session.user.user_metadata || {};
      const nombre = m.display_name || m.full_name || session.user.email.split('@')[0];
      $('quien').textContent = nombre.charAt(0).toUpperCase() + nombre.slice(1) + ' · ' + perfil.rol;
      supabaseClient.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.href = 'index.html'; });
      const { data } = await supabaseClient.from('ultimo_proveedor').select('updated_at').order('updated_at', { ascending: false }).limit(1);
      $('sync').lastChild.textContent = data && data[0] ? 'Datos actualizados: ' + new Date(data[0].updated_at).toLocaleString('es-VE') : 'Sin datos sincronizados';
    })();
  </script>
</body>

</html>
